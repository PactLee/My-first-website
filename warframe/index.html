<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>워프레임 도우미 - 프라임 &amp; 렐릭</title>
    <style>
        :root { --bg: #14161b; --card: #1e2128; --line: #2e323b; --text: #e6e6e6; --sub: #9aa0aa;
                --accent: #d8b46a; --common: #c08a5a; --uncommon: #b9bec7; --rare: #e3c45b; --vault: #c0504d; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
        header { padding: 16px; border-bottom: 1px solid var(--line); }
        header h1 { margin: 0 0 12px; font-size: 20px; color: var(--accent); }
        header a { color: var(--sub); font-size: 13px; }
        .controls { display: flex; gap: 8px; flex-wrap: wrap; }
        .tabs button { background: var(--card); color: var(--text); border: 1px solid var(--line); padding: 8px 14px; cursor: pointer; border-radius: 6px; }
        .tabs button.on { border-color: var(--accent); color: var(--accent); }
        input[type=search] { flex: 1; min-width: 200px; padding: 8px 12px; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font-size: 15px; }
        label { color: var(--sub); font-size: 14px; align-self: center; }
        main { padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
        .head { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
        .head img { width: 48px; height: 48px; object-fit: contain; }
        .head .t { font-weight: bold; font-size: 16px; }
        .head .e { color: var(--sub); font-size: 12px; }
        .badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-left: 6px; background: var(--line); color: var(--sub); font-weight: normal; }
        .badge.vault { background: var(--vault); color: #fff; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 4px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
        th { color: var(--sub); font-weight: normal; }
        th, td.n, td.nw { white-space: nowrap; }
        td.n { text-align: right; }
        .chip { display: inline-block; margin: 1px; padding: 1px 6px; border-radius: 4px; background: var(--bg); cursor: pointer; font-size: 12px; }
        .Common { color: var(--common); } .Uncommon { color: var(--uncommon); } .Rare { color: var(--rare); }
        .note { color: var(--sub); font-size: 12px; margin-top: 6px; }
        .empty { color: var(--sub); padding: 24px; }
        button.load { margin-left: auto; background: var(--bg); color: var(--accent); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>워프레임 도우미 <a href="../index.html">← 홈</a></h1>
        <div class="controls">
            <div class="tabs">
                <button data-tab="sets" class="on">프라임 세트</button>
                <button data-tab="relics">렐릭</button>
            </div>
            <input id="q" type="search" placeholder="한글 또는 영어로 검색 (예: 애쉬, Ash, 액시 A1)">
            <label><input id="hideVault" type="checkbox"> 볼트된 세트 숨기기</label>
        </div>
        <div class="note">시세: warframe.market 접속 중인 판매자 최저가 (마우스를 올리면 최고 구매가) · 10분간 저장 <span id="priceMsg" style="color:var(--vault)"></span></div>
    </header>
    <main id="list"><div class="empty">데이터 불러오는 중…</div></main>

    <script>
        const RARITY_KO = { Common: "흔함", Uncommon: "드묾", Rare: "희귀" };
        const IMG = "https://cdn.warframestat.us/img/";
        const LIMIT = 60;
        let data, setByName, tab = "sets";
        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        const norm = (s) => s.toLowerCase().replace(/\s+/g, "");

        // ---- 시세 (warframe.market) ----
        // tools/server.py 로 열면 /wfm 프록시를, 아니면 warframe.market API 를 직접 호출한다.
        const WFM_PROXY = "/wfm/v2", WFM_DIRECT = "https://api.warframe.market/v2";
        const PRICE_TTL = 10 * 60 * 1000, RETRY_AFTER = 60 * 1000, REQUEST_GAP = 350;
        const AUTO_PRICE_MAX = 2; // 검색 결과가 이 개수 이하면 시세를 자동으로 불러온다
        let wfmBase = null, priceFailShown = false, busy = false;
        const queue = [];
        const prices = (() => { try { return JSON.parse(localStorage.getItem("wfPrices")) || {}; } catch (e) { return {}; } })();
        const savePrices = () => { try { localStorage.setItem("wfPrices", JSON.stringify(prices)); } catch (e) {} };
        const fresh = (p) => p && Date.now() - p.t < (p.err ? RETRY_AFTER : PRICE_TTL);
        const partOf = (w) => { const s = setByName[w.set]; return s && s.parts.find((x) => x.name === w.part); };

        async function fetchTop(slug) {
            const bases = wfmBase ? [wfmBase] : [WFM_PROXY, WFM_DIRECT];
            let lastErr;
            for (const base of bases) {
                try {
                    const res = await fetch(`${base}/orders/item/${slug}/top`);
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    const json = await res.json();
                    wfmBase = base;
                    return json.data;
                } catch (e) { lastErr = e; }
            }
            throw lastErr;
        }

        function requestPrices(slugs) {
            for (const slug of slugs) if (slug && !fresh(prices[slug]) && !queue.includes(slug)) queue.push(slug);
            pump();
        }

        async function pump() {
            if (busy) return;
            busy = true;
            while (queue.length) {
                const slug = queue.shift();
                try {
                    const d = await fetchTop(slug);
                    const sell = d.sell.map((o) => o.platinum), buy = d.buy.map((o) => o.platinum);
                    prices[slug] = { sell: sell.length ? Math.min(...sell) : null, buy: buy.length ? Math.max(...buy) : null, t: Date.now() };
                } catch (e) {
                    prices[slug] = { err: true, t: Date.now() };
                    if (!priceFailShown) {
                        priceFailShown = true;
                        $("priceMsg").textContent = "시세를 불러오지 못했습니다. 브라우저가 warframe.market 직접 접속을 막았을 수 있어요 — README의 tools/server.py 로 실행해 보세요.";
                    }
                }
                savePrices();
                paintPrices();
                await new Promise((r) => setTimeout(r, REQUEST_GAP));
            }
            busy = false;
        }

        function priceText(slug) {
            const p = prices[slug];
            if (!slug) return "-";
            if (!p) return "";
            if (p.err) return '<span title="불러오기 실패">⚠</span>';
            return `<span title="최고 구매가 ${p.buy ?? "-"}p">${p.sell ?? "-"}p</span>`;
        }

        // 렐릭 정제 단계별 기대값 = Σ(확률 × 최저 판매가). 시세가 다 모일 때까지는 비워둔다.
        function evCells(r) {
            const ps = r.rewards.map((w) => { const p = partOf(w); return p && prices[p.market]; });
            if (ps.some((p) => !p)) return "<td></td><td></td><td></td><td></td>";
            return [0, 1, 2, 3].map((i) => {
                const v = r.rewards.reduce((sum, w, k) => sum + (w.chance[i] / 100) * ((ps[k] && ps[k].sell) || 0), 0);
                return `<td class="n">${v.toFixed(1)}p</td>`;
            }).join("");
        }

        function paintPrices() {
            document.querySelectorAll("[data-price]").forEach((el) => { el.innerHTML = priceText(el.dataset.price); });
            document.querySelectorAll("[data-ev]").forEach((el) => {
                const r = data.relics.find((x) => x.name === el.dataset.ev);
                el.innerHTML = `<td>기대값</td>${evCells(r)}<td></td>`;
            });
        }

        const setSlugs = (s) => [s.market, ...s.parts.map((p) => p.market)];
        const relicSlugs = (r) => r.rewards.map((w) => (partOf(w) || {}).market);

        function setCard(s) {
            const rows = s.parts.map((p) => `
                <tr><td class="nw">${esc(p.ko)}${p.count > 1 ? " ×" + p.count : ""}</td>
                    <td class="n">${p.ducats} 두캇</td>
                    <td class="n" data-price="${esc(p.market || "")}">${priceText(p.market)}</td>
                    <td>${p.relics.map((r) => `<span class="chip ${r.rarity}" data-relic="${esc(r.relic)}">${esc(r.relic)}</span>`).join("") || "-"}</td></tr>`).join("");
            return `<div class="card">
                <div class="head">${s.image ? `<img src="${IMG}${esc(s.image)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
                    <div><div class="t">${esc(s.ko)}${s.vaulted ? '<span class="badge vault">볼트</span>' : ""}<span class="badge">${esc(s.category)}</span></div>
                    <div class="e">${esc(s.name)}</div></div>
                    <button class="load" data-set="${esc(s.name)}">시세</button></div>
                <table><tr><th>부품</th><th class="n">두캇</th><th class="n">시세</th><th>렐릭 (Intact 기준 희귀도)</th></tr>${rows}
                    <tr><td>세트 전체</td><td></td><td class="n" data-price="${esc(s.market)}">${priceText(s.market)}</td><td></td></tr></table></div>`;
        }

        function relicCard(r) {
            const rows = r.rewards.map((w) => {
                const s = setByName[w.set], p = partOf(w);
                return `<tr><td class="${w.rarity}">${esc(s ? s.ko : w.set)} ${esc(p ? p.ko : w.part)}<br><span class="e" style="color:var(--sub)">${RARITY_KO[w.rarity]}</span></td>
                    ${w.chance.map((c) => `<td class="n">${c}%</td>`).join("")}
                    <td class="n" data-price="${esc((p && p.market) || "")}">${priceText(p && p.market)}</td></tr>`;
            }).join("");
            return `<div class="card">
                <div class="head"><div><div class="t">${esc(r.ko)}</div><div class="e">${esc(r.name)} Relic</div></div>
                    <button class="load" data-relic-price="${esc(r.name)}">시세</button></div>
                <table><tr><th>보상</th><th class="n">Intact</th><th class="n">Excep.</th><th class="n">Flaw.</th><th class="n">Rad.</th><th class="n">시세</th></tr>${rows}
                    <tr data-ev="${esc(r.name)}"><td>기대값</td>${evCells(r)}<td></td></tr></table>
                ${r.rewards.length < 6 ? '<div class="note">+ 포르마 설계도 등 프라임 부품이 아닌 보상은 표시하지 않음 (기대값에서도 제외)</div>' : ""}</div>`;
        }

        function render() {
            const q = norm($("q").value);
            const hide = $("hideVault").checked;
            let items;
            if (tab === "sets") {
                items = data.sets.filter((s) => (!hide || !s.vaulted) && (!q || norm(s.ko).includes(q) || norm(s.name).includes(q)));
            } else {
                items = data.relics.filter((r) => !q || norm(r.ko).includes(q) || norm(r.name).includes(q)
                    || r.rewards.some((w) => norm(w.set).includes(q) || norm(setByName[w.set] ? setByName[w.set].ko : "").includes(q)));
            }
            const html = items.slice(0, LIMIT).map(tab === "sets" ? setCard : relicCard).join("");
            $("list").innerHTML = html || '<div class="empty">검색 결과가 없습니다.</div>';
            if (items.length > LIMIT) $("list").insertAdjacentHTML("beforeend", `<div class="empty">${items.length - LIMIT}개 더 있음 — 검색어를 더 입력하세요.</div>`);
            if (q && items.length <= AUTO_PRICE_MAX) items.forEach((x) => requestPrices(tab === "sets" ? setSlugs(x) : relicSlugs(x)));
        }

        function switchTab(t) {
            tab = t;
            document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === t));
            $("hideVault").parentElement.style.display = t === "sets" ? "" : "none";
            render();
        }

        document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => switchTab(b.dataset.tab)));
        $("q").addEventListener("input", render);
        $("hideVault").addEventListener("change", render);
        $("list").addEventListener("click", (e) => {
            const ds = e.target.dataset || {};
            if (ds.relic) { $("q").value = ds.relic; switchTab("relics"); }
            if (ds.set) requestPrices(setSlugs(setByName[ds.set]));
            if (ds.relicPrice) requestPrices(relicSlugs(data.relics.find((r) => r.name === ds.relicPrice)));
        });

        fetch("data/primes.json")
            .then((r) => r.json())
            .then((d) => { data = d; setByName = Object.fromEntries(d.sets.map((s) => [s.name, s])); render(); })
            .catch(() => { $("list").innerHTML = '<div class="empty">데이터를 불러오지 못했습니다. 파일을 직접 열지 말고 웹 서버(GitHub Pages 등)로 열어주세요.</div>'; });
    </script>
</body>
</html>
